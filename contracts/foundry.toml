[profile.default]
src = "."
test = "test"
script = "script"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "osaka"
solc = "0.8.35"
auto_detect_solc = false
bytecode_hash = "ipfs"
cbor_metadata = true
fs_permissions = [
    { access = "write", path = "./deployments" },
    { access = "read", path = "./test/vectors" },
]
