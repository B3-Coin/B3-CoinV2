# B3 Hive unsigned release builds for Linux x86-64, Windows x86-64,
# macOS arm64, and macOS x86-64. Runs on demand ("Run workflow" button) and on
# matching version tags. Release-branch pushes do not duplicate tag builds.
name: release-build

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

# Avoid duplicate work when the same tag build is restarted or superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive and validate source version
        id: source_version
        shell: bash
        run: |
          set -euo pipefail
          cmake_version_part() {
            sed -nE "s/^set\\($1[[:space:]]+([0-9]+)\\).*$/\\1/p" CMakeLists.txt
          }
          major=$(cmake_version_part CLIENT_VERSION_MAJOR)
          minor=$(cmake_version_part CLIENT_VERSION_MINOR)
          build=$(cmake_version_part CLIENT_VERSION_BUILD)
          rc=$(cmake_version_part CLIENT_VERSION_RC)
          for part in "$major" "$minor" "$build" "$rc"; do
            [[ "$part" =~ ^[0-9]+$ ]] || {
              echo "Could not derive one numeric source-version component" >&2
              exit 1
            }
          done
          source_version="$major.$minor.$build"
          if (( rc > 0 )); then
            source_version="${source_version}rc${rc}"
          fi
          version="$source_version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" == "v$source_version" ]]; then
              : # Normal source-version release.
            elif [[ "$source_version" == "1.0.0" && "$GITHUB_REF_NAME" == "v1.0.0rev" ]]; then
              # Owner-selected packaging revision: the client/protocol version
              # remains 1.0.0, while filenames and the release page remain
              # distinguishable from the original v1.0.0 artifacts.
              version="1.0.0rev"
            else
              echo "Release tag $GITHUB_REF_NAME does not match source version v$source_version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-x86_64:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf python3 \
            libevent-dev libboost-dev libsqlite3-dev capnproto libcapnp-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=ON
      - name: Build
        # Release packaging compiles only the programs that ship to users.
        # Tests remain available through the manually triggered CI workflow.
        run: >-
          cmake --build build -j"$(nproc)" --target
          b3coin-qt b3coind b3coin-cli b3coin-tx b3coin-util b3coin-wallet
      - name: Package
        run: |
          mkdir -p out
          name=b3-hive-v${{ needs.version.outputs.version }}-unsigned-linux-x86_64
          stage=$(mktemp -d)
          mkdir -p "$stage/$name/bin"
          cp build/bin/b3coin-qt build/bin/b3coind build/bin/b3coin-cli \
            build/bin/b3coin-tx build/bin/b3coin-util build/bin/b3coin-wallet \
            "$stage/$name/bin/"
          cp README.md COPYING "$stage/$name/"
          tar -C "$stage" -czf "out/$name.tar.gz" "$name"
          (cd out && sha256sum *.tar.gz > SHA256SUMS.linux)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-linux-x86_64
          path: out/

  windows-cross:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl make pkgconf python3 \
            g++-mingw-w64-x86-64-posix nsis zip
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Build depends (Qt + libs for Windows)
        run: |
          cd depends && make HOST=x86_64-w64-mingw32 -j"$(nproc)"
      - name: Configure + build
        run: |
          cmake -B build --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target deploy
      - name: Package
        run: |
          mkdir -p out
          cp build/b3coin-win64-setup.exe \
            out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-win64-setup.exe
          zip -j out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-win64.zip \
            build/release/b3coin-qt.exe build/release/b3coind.exe \
            build/release/b3coin-cli.exe build/release/b3coin-tx.exe \
            build/release/b3coin-util.exe build/release/b3coin-wallet.exe \
            README.md COPYING
          (cd out && sha256sum *.exe *.zip > SHA256SUMS.win64)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-win64
          path: out/

  macos-arm64:
    needs: version
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: Install toolchain
        run: brew install cmake boost libevent sqlite capnp qt@6 qrencode
      - name: Configure + build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          # Release packaging builds only the programs shipped to users. Test
          # binaries and suites remain in the separately triggered CI workflow.
          cmake --build build -j4 --target deploy b3coind b3coin-cli b3coin-tx b3coin-util b3coin-wallet
      - name: Verify unsigned app bundle
        run: |
          set -euo pipefail
          unzip -q build/b3coin-macos-app.zip -d build/app-check
          app='build/app-check/B3 Hive.app'
          deployment_target=15.0
          expected_arch=arm64
          test "$(plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist")" = "B3 Hive"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "co.b3coin.B3Hive"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "$deployment_target"
          version_le() {
            /usr/bin/awk -v actual="$1" -v limit="$2" 'BEGIN {
              na = split(actual, a, "."); nl = split(limit, l, ".");
              for (i = 1; i <= 4; ++i) {
                av = (i <= na ? a[i] + 0 : 0); lv = (i <= nl ? l[i] + 0 : 0);
                if (av < lv) exit 0;
                if (av > lv) exit 1;
              }
              exit 0;
            }'
          }
          mach_o_count=0
          while IFS= read -r -d '' candidate; do
            if [[ "$(file -b "$candidate")" == *Mach-O* ]]; then
              test "$(lipo -archs "$candidate")" = "$expected_arch"
              if otool -L "$candidate" | /usr/bin/awk '
                  NR > 1 && $1 ~ /^\/(opt\/homebrew|usr\/local)\// {found = 1}
                  END {exit !found}
                '; then
                echo "Unbundled Homebrew dependency in $candidate" >&2
                exit 1
              fi
              minos_values=$(otool -l "$candidate" | /usr/bin/awk '
                $1 == "cmd" {build = ($2 == "LC_BUILD_VERSION"); legacy = ($2 == "LC_VERSION_MIN_MACOSX"); next}
                build && $1 == "minos" {print $2; build = 0}
                legacy && $1 == "version" {print $2; legacy = 0}
              ')
              test -n "$minos_values"
              while IFS= read -r minos; do
                version_le "$minos" "$deployment_target" || {
                  echo "$candidate requires macOS $minos, newer than $deployment_target" >&2
                  exit 1
                }
              done < <(printf '%s\n' "$minos_values")
              mach_o_count=$((mach_o_count + 1))
            fi
          done < <(find "$app" -type f -print0)
          test "$mach_o_count" -gt 0
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/b3coin-qt" -version >/dev/null
      - name: Package
        run: |
          mkdir -p out
          cp build/b3coin-macos-app.zip out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-macos-arm64.zip
          (cd out && shasum -a 256 *.zip > SHA256SUMS.macos-arm64)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-macos-arm64
          path: out/

  macos-x86_64:
    needs: version
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: Install toolchain
        run: brew install cmake boost libevent sqlite capnp qt@6 qrencode
      - name: Configure + build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          # Release packaging builds only the programs shipped to users. Test
          # binaries and suites remain in the separately triggered CI workflow.
          cmake --build build -j4 --target deploy b3coind b3coin-cli b3coin-tx b3coin-util b3coin-wallet
      - name: Verify unsigned app bundle
        run: |
          set -euo pipefail
          unzip -q build/b3coin-macos-app.zip -d build/app-check
          app='build/app-check/B3 Hive.app'
          deployment_target=15.0
          expected_arch=x86_64
          test "$(plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist")" = "B3 Hive"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "co.b3coin.B3Hive"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "$deployment_target"
          version_le() {
            /usr/bin/awk -v actual="$1" -v limit="$2" 'BEGIN {
              na = split(actual, a, "."); nl = split(limit, l, ".");
              for (i = 1; i <= 4; ++i) {
                av = (i <= na ? a[i] + 0 : 0); lv = (i <= nl ? l[i] + 0 : 0);
                if (av < lv) exit 0;
                if (av > lv) exit 1;
              }
              exit 0;
            }'
          }
          mach_o_count=0
          while IFS= read -r -d '' candidate; do
            if [[ "$(file -b "$candidate")" == *Mach-O* ]]; then
              test "$(lipo -archs "$candidate")" = "$expected_arch"
              if otool -L "$candidate" | /usr/bin/awk '
                  NR > 1 && $1 ~ /^\/(opt\/homebrew|usr\/local)\// {found = 1}
                  END {exit !found}
                '; then
                echo "Unbundled Homebrew dependency in $candidate" >&2
                exit 1
              fi
              minos_values=$(otool -l "$candidate" | /usr/bin/awk '
                $1 == "cmd" {build = ($2 == "LC_BUILD_VERSION"); legacy = ($2 == "LC_VERSION_MIN_MACOSX"); next}
                build && $1 == "minos" {print $2; build = 0}
                legacy && $1 == "version" {print $2; legacy = 0}
              ')
              test -n "$minos_values"
              while IFS= read -r minos; do
                version_le "$minos" "$deployment_target" || {
                  echo "$candidate requires macOS $minos, newer than $deployment_target" >&2
                  exit 1
                }
              done < <(printf '%s\n' "$minos_values")
              mach_o_count=$((mach_o_count + 1))
            fi
          done < <(find "$app" -type f -print0)
          test "$mach_o_count" -gt 0
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/b3coin-qt" -version >/dev/null
      - name: Package
        run: |
          mkdir -p out
          cp build/b3coin-macos-app.zip out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-macos-x86_64.zip
          (cd out && shasum -a 256 *.zip > SHA256SUMS.macos-x86_64)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-macos-x86_64
          path: out/

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, linux-x86_64, windows-cross, macos-arm64, macos-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: b3-hive-*
          merge-multiple: true
      - name: Verify packaged checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.linux
          sha256sum --check SHA256SUMS.win64
          sha256sum --check SHA256SUMS.macos-arm64
          sha256sum --check SHA256SUMS.macos-x86_64
          cat SHA256SUMS.linux SHA256SUMS.win64 SHA256SUMS.macos-arm64 \
            SHA256SUMS.macos-x86_64 \
            | sort -k2 > SHA256SUMS
      - name: Publish final GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="doc/release-notes-${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft)
            asset_count=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets | length')
            if (( asset_count != 0 )); then
              echo "Refusing to overwrite a release that already has uploaded assets" >&2
              exit 1
            fi
            # v1.0.0 already exists as the published, assetless release-candidate
            # page. Permit that one migration; all later published tags are immutable.
            if [[ "$is_draft" != "true" && "$GITHUB_REF_NAME" != "v1.0.0" ]]; then
              echo "Refusing to overwrite an existing published release" >&2
              exit 1
            fi
            if [[ "$is_draft" != "true" ]]; then
              # Hide the assetless candidate while the complete final asset set
              # uploads. Any failure leaves a draft, never a partial public release.
              gh release edit "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" --verify-tag --draft=true
            fi
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "B3 Hive $GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              --draft=false --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "B3 Hive $GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              --latest
          fi
