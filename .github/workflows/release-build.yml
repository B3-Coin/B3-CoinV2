# B3 Hive release builds: Linux x86-64 (+ tests & frozen vectors -- the
# x86-64 release gate) and the Windows cross-compile. Runs on demand
# ("Run workflow" button) and on pushes to release branches.
name: release-build

on:
  workflow_dispatch:
  push:
    branches: [ "release/*" ]

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf python3 \
            libevent-dev libboost-dev libsqlite3-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)" --target b3coind b3coin-cli b3coin-tx b3coin-wallet test_bitcoin
      - name: HARD gate -- every suite except the documented stock set
        run: |
          # Everything must pass EXCEPT the enumerated known-stock
          # IDENT/DENOM/FIXTURE suites (doc/design/b3-test-baseline.md).
          # A failure in ANY other suite stops the release build.
          cd build && ctest --output-on-failure -j2             -E "(validation_tests|compress_tests|util_tests|rpc_tests|key_tests|key_io_tests|bip324_tests|bloom_tests|script_standard_tests|net_peer_connection_tests|miner_tests|validation_chainstatemanager_tests|txpackage_tests|validation_chainstate_tests|blockchain_tests|descriptor_tests|interfaces_tests|disconnected_transactions|mock_process)$"
      - name: Known-stock set (report-only, drift visibility)
        continue-on-error: true
        run: |
          cd build && ctest --output-on-failure -j2             -R "(validation_tests|compress_tests|util_tests|rpc_tests|key_tests|key_io_tests|bip324_tests|bloom_tests|script_standard_tests|net_peer_connection_tests|miner_tests|validation_chainstatemanager_tests|txpackage_tests|validation_chainstate_tests|blockchain_tests|descriptor_tests|interfaces_tests|disconnected_transactions|mock_process)$"
      - name: Frozen-vector suites (hard gate)
        run: |
          ./build/bin/test_bitcoin --run_test=finality_types_tests
          ./build/bin/test_bitcoin --run_test=finality_certificate_tests
          ./build/bin/test_bitcoin --run_test=modern_reward_tests
          ./build/bin/test_bitcoin --run_test=bridge_mpt_tests
          ./build/bin/test_bitcoin --run_test=bridge_eth_light_client_tests
          ./build/bin/test_bitcoin --run_test=bridge_exec_chain_tests
          ./build/bin/test_bitcoin --run_test=update_manifest_tests
          ./build/bin/test_bitcoin --run_test=update_downloader_tests
          ./build/bin/test_bitcoin --run_test=update_manager_tests
          ./build/bin/test_bitcoin --run_test=legacy_genesis_tests
          ./build/bin/test_bitcoin --run_test=legacy_wallet_send_tests
          ./build/bin/test_bitcoin --run_test=consensus_phase_tests
          ./build/bin/test_bitcoin --run_test=finality_activation_tests
          ./build/bin/test_bitcoin --run_test=finality_epoch_tests
          ./build/bin/test_bitcoin --run_test=finality_pin_tests
          ./build/bin/test_bitcoin --run_test=finality_pin_persist_tests
          ./build/bin/test_bitcoin --run_test=finality_eligibility_tests
          ./build/bin/test_bitcoin --run_test=finality_key_tests
          ./build/bin/test_bitcoin --run_test=finality_key_binding_tests
          ./build/bin/test_bitcoin --run_test=bridge_deposit_tests
          ./build/bin/test_bitcoin --run_test=modern_pos_tests
          ./build/bin/test_bitcoin --run_test=script_tests
          ./build/bin/test_bitcoin --run_test=transaction_tests
          ./build/bin/test_bitcoin --run_test=sighash_tests
          ./build/bin/test_bitcoin --run_test=finality_operations_tests
          ./build/bin/test_bitcoin --run_test=finality_production_tests
          ./build/bin/test_bitcoin --run_test=finality_qualification_tests
      - name: Package
        run: |
          mkdir -p out && tar -C build/bin -czf out/b3-hive-1.0.0-linux-x86_64.tar.gz \
            b3coind b3coin-cli b3coin-tx b3coin-wallet
          shasum -a 256 out/*.tar.gz > out/SHA256SUMS.linux
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-linux-x86_64
          path: out/

  windows-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl make pkgconf python3 \
            g++-mingw-w64-x86-64-posix nsis zip
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Build depends (Qt + libs for Windows)
        run: |
          cd depends && make HOST=x86_64-w64-mingw32 -j"$(nproc)"
      - name: Configure + build
        run: |
          cmake -B build --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target b3coind b3coin-cli b3coin-qt
      - name: Package
        run: |
          mkdir -p out
          zip -j out/b3-hive-1.0.0-win64.zip \
            build/bin/b3coind.exe build/bin/b3coin-cli.exe build/bin/b3coin-qt.exe
          sha256sum out/*.zip > out/SHA256SUMS.win64
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-win64
          path: out/
