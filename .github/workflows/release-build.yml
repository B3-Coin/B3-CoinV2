# B3 Hive unsigned release builds for Linux x86-64, Windows x86-64,
# macOS arm64, and macOS x86-64. Runs on demand ("Run workflow" button) and on
# matching version tags. Release-branch pushes do not duplicate tag builds.
name: release-build

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

# Avoid duplicate work when the same tag build is restarted or superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source_version.outputs.version }}
      source_version: ${{ steps.source_version.outputs.source_version }}
      prerelease: ${{ steps.source_version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive and validate source version
        id: source_version
        shell: bash
        run: |
          set -euo pipefail
          cmake_version_part() {
            sed -nE "s/^set\\($1[[:space:]]+([0-9]+)\\).*$/\\1/p" CMakeLists.txt
          }
          major=$(cmake_version_part CLIENT_VERSION_MAJOR)
          minor=$(cmake_version_part CLIENT_VERSION_MINOR)
          build=$(cmake_version_part CLIENT_VERSION_BUILD)
          rc=$(cmake_version_part CLIENT_VERSION_RC)
          prerelease=$(sed -nE 's/^set\(CLIENT_VERSION_PRERELEASE[[:space:]]+"([^"]*)"\).*$/\1/p' CMakeLists.txt)
          for part in "$major" "$minor" "$build" "$rc"; do
            [[ "$part" =~ ^[0-9]+$ ]] || {
              echo "Could not derive one numeric source-version component" >&2
              exit 1
            }
          done
          if [[ -n "$prerelease" && ! "$prerelease" =~ ^[0-9A-Za-z]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid source prerelease identifier: $prerelease" >&2
            exit 1
          fi
          if (( rc > 0 )) && [[ -n "$prerelease" ]]; then
            echo "CLIENT_VERSION_RC and CLIENT_VERSION_PRERELEASE are mutually exclusive" >&2
            exit 1
          fi
          source_version="$major.$minor.$build"
          if (( rc > 0 )); then
            source_version="${source_version}rc${rc}"
          elif [[ -n "$prerelease" ]]; then
            source_version="${source_version}-${prerelease}"
          fi
          version="$source_version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" == "v$source_version" ]]; then
              : # Normal source-version release.
            elif [[ "$source_version" == "1.0.0" && ( "$GITHUB_REF_NAME" == "v1.0.0rev" || "$GITHUB_REF_NAME" == "v1.0.0rev2" ) ]]; then
              # Owner-selected packaging revision: the client/protocol version
              # remains 1.0.0, while filenames and the release page remain
              # distinguishable from the original v1.0.0 artifacts.
              version="${GITHUB_REF_NAME#v}"
            else
              echo "Release tag $GITHUB_REF_NAME does not match source version v$source_version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          if (( rc > 0 )) || [[ -n "$prerelease" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  release-tests:
    # These time-critical validator-transition betas retain every platform
    # build, checksum, and contract gate below, but do not duplicate their
    # recorded local focused qualification. No later beta/RC inherits this
    # exception.
    # Other builds run the complete suite unless an administrator binds the
    # emergency opt-out to their exact commit SHA.
    if: github.ref != 'refs/tags/v1.1.1-beta.2' && github.ref != 'refs/tags/v1.1.1-beta.3' && vars.B3_SKIP_EXTENDED_RELEASE_TESTS_SHA != github.sha
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf python3 \
            libevent-dev libboost-dev libsqlite3-dev capnproto libcapnp-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev
      - name: Configure exact-source release tests
        run: >-
          cmake -B build-test -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=ON -DBUILD_TESTS=ON -DBUILD_GUI_TESTS=ON
          -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF
          -DB3_BRIDGE_TOOLS=ON
      - name: Build test and functional-test programs
        run: >-
          cmake --build build-test -j"$(nproc)" --target
          test_bitcoin test_bitcoin-qt b3coind b3coin-cli
          b3-bridge-ethcheck b3-bridge-bootstrap-proof
      - name: Verify tested source version
        run: >-
          build-test/bin/b3coind -nosettings -version |
          grep -F "version v${{ needs.version.outputs.source_version }}"
      - name: Run complete node and wallet unit suite
        run: >-
          build-test/bin/test_bitcoin
          --log_level=error --report_level=detailed
      - name: Run full Qt suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: build-test/bin/test_bitcoin-qt
      - name: Run automatic bridge-relayer recovery suite
        run: python3 contrib/b3bridge/test_b3_bridge_relayer.py
      - name: Run transition functional gate
        run: >-
          python3 build-test/test/functional/test_runner.py
          --jobs=2 --failfast --combinedlogslen=1000
          wallet_fn_genesis_rescan.py
          wallet_importlegacywalletdump.py
          wallet_importprunedfunds.py
          feature_b3_finality_mempool.py
          feature_b3_finality_soak.py
          feature_flowmesh_release.py

  release-test-policy:
    if: always()
    needs: [version, release-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce or explicitly record extended-test policy
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          TEST_RESULT: ${{ needs['release-tests'].result }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          RELEASE_REF: ${{ github.ref }}
          SKIP_SHA: ${{ vars.B3_SKIP_EXTENDED_RELEASE_TESTS_SHA }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$VERSION_RESULT" = success
          if test "$TEST_RESULT" = success; then
            echo "Extended GitHub release qualification passed."
          elif test "$TEST_RESULT" = skipped && test "$PRERELEASE" = true && { test "$RELEASE_REF" = refs/tags/v1.1.1-beta.2 || test "$RELEASE_REF" = refs/tags/v1.1.1-beta.3; }; then
            echo "::warning::Extended GitHub qualification was skipped for the time-critical validator-transition beta; platform builds, checksums, and contract gates remain mandatory."
          elif test "$TEST_RESULT" = skipped && test "$SKIP_SHA" = "$RELEASE_SHA"; then
            echo "::warning::Extended GitHub release qualification was explicitly skipped for exact commit $RELEASE_SHA. The tagging operator is responsible for preserving qualification logs for this commit."
          else
            echo "Extended release qualification failed or was skipped without the explicit repository opt-out." >&2
            exit 1
          fi

  contract-tests:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build and test decentralized bridge contracts
        working-directory: contracts
        run: forge test
      - name: Enforce EIP-170 on deployed runtimes only
        working-directory: contracts
        run: script/check-deployable-sizes.sh

  linux-x86_64:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf python3 \
            libevent-dev libboost-dev libsqlite3-dev capnproto libcapnp-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=ON -DBUILD_TESTS=OFF -DBUILD_GUI_TESTS=OFF
          -DBUILD_TX=ON -DBUILD_UTIL=ON -DBUILD_WALLET_TOOL=ON
          -DB3_BRIDGE_TOOLS=ON
      - name: Build
        # Release packaging compiles only the programs that ship to users.
        # The release-tests job qualifies the exact same source revision.
        run: >-
          cmake --build build -j"$(nproc)" --target
          b3coin-qt b3coind b3coin-cli b3coin-tx b3coin-util b3coin-wallet
          b3-bridge-ethcheck b3-bridge-bootstrap-proof
      - name: Package
        run: |
          mkdir -p out
          name=b3-hive-v${{ needs.version.outputs.version }}-unsigned-linux-x86_64
          stage=$(mktemp -d)
          mkdir -p "$stage/$name/bin" "$stage/$name/contrib/b3bridge"
          cp build/bin/b3coin-qt build/bin/b3coind build/bin/b3coin-cli \
            build/bin/b3coin-tx build/bin/b3coin-util build/bin/b3coin-wallet \
            build/bin/b3-bridge-ethcheck build/bin/b3-bridge-bootstrap-proof \
            "$stage/$name/bin/"
          cp contrib/b3bridge/README.md \
            contrib/b3bridge/b3_bridge_relayer.py \
            contrib/b3bridge/capture_eth_lc_fixture.py \
            contrib/b3bridge/capture_eth_receipts_fixture.py \
            contrib/b3bridge/eth_live_test.py \
            contrib/b3bridge/test_b3_bridge_relayer.py \
            "$stage/$name/contrib/b3bridge/"
          cp README.md COPYING "$stage/$name/"
          tar -C "$stage" -czf "out/$name.tar.gz" "$name"
          (cd out && sha256sum *.tar.gz > SHA256SUMS.linux)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-linux-x86_64
          path: out/

  linux-x86_64-static:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify fully static operator binaries
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            mirror.gcr.io/alpine:3.23 \
            sh -euxc '
              apk add --no-cache \
                bash binutils bison build-base cmake curl file git linux-headers \
                make ninja patch pkgconf python3 xz
              git config --global --add safe.directory /src
              host="$(./depends/config.guess)"
              test "$host" = x86_64-pc-linux-musl
              make -C depends HOST="$host" NO_QT=1 NO_QR=1 NO_ZMQ=1 \
                NO_USDT=1 NO_IPC=1 -j"$(nproc)"
              cmake -S . -B build-static \
                --toolchain "depends/$host/toolchain.cmake" \
                -DCMAKE_BUILD_TYPE=Release \
                -DAPPEND_LDFLAGS=-static-pie \
                -DCMAKE_SKIP_RPATH=TRUE \
                -DREDUCE_EXPORTS=ON \
                -DBUILD_GUI=OFF \
                -DBUILD_TESTS=OFF \
                -DBUILD_GUI_TESTS=OFF \
                -DENABLE_IPC=OFF \
                -DWITH_ZMQ=OFF \
                -DWITH_USDT=OFF \
                -DBUILD_TX=ON \
                -DBUILD_UTIL=ON \
                -DBUILD_WALLET_TOOL=ON \
                -DB3_BRIDGE_TOOLS=ON
              cmake --build build-static -j"$(nproc)" --target \
                b3coind b3coin-cli b3coin-tx b3coin-util b3coin-wallet \
                b3-bridge-ethcheck b3-bridge-bootstrap-proof
              for binary in b3coind b3coin-cli b3coin-tx b3coin-util b3coin-wallet; do
                file "build-static/bin/$binary" | grep -Eq "static-pie linked|statically linked"
                ! readelf -l "build-static/bin/$binary" | grep -q "Requesting program interpreter"
                ! readelf -d "build-static/bin/$binary" 2>&1 | grep -q NEEDED
                if test "$binary" = b3coind; then
                  "build-static/bin/$binary" -nosettings -version >/dev/null
                else
                  "build-static/bin/$binary" -version >/dev/null
                fi
              done
              for binary in b3-bridge-ethcheck b3-bridge-bootstrap-proof; do
                file "build-static/bin/$binary" | grep -Eq "static-pie linked|statically linked"
                ! readelf -l "build-static/bin/$binary" | grep -q "Requesting program interpreter"
                ! readelf -d "build-static/bin/$binary" 2>&1 | grep -q NEEDED
              done

              smoke_dir="$(mktemp -d)"
              rpc_port=18455
              build-static/bin/b3coind -regtest -datadir="$smoke_dir" \
                -server -daemonwait -networkactive=0 -listen=0 -discover=0 \
                -dnsseed=0 -listenonion=0 -natpmp=0 -nosettings \
                -rpcport="$rpc_port"
              build-static/bin/b3coin-cli -regtest -datadir="$smoke_dir" \
                -rpcport="$rpc_port" getblockchaininfo >/dev/null
              build-static/bin/b3coin-cli -regtest -datadir="$smoke_dir" \
                -rpcport="$rpc_port" createwallet static-smoke >/dev/null
              build-static/bin/b3coin-cli -regtest -datadir="$smoke_dir" \
                -rpcport="$rpc_port" -rpcwallet=static-smoke \
                getwalletinfo >/dev/null
              build-static/bin/b3coin-cli -regtest -datadir="$smoke_dir" \
                -rpcport="$rpc_port" stop
              for attempt in $(seq 1 300); do
                test ! -f "$smoke_dir/regtest/b3coind.pid" && break
                sleep 0.1
              done
              test ! -f "$smoke_dir/regtest/b3coind.pid"
              rm -rf "$smoke_dir"
            '
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          name=b3-hive-v${{ needs.version.outputs.version }}-unsigned-linux-x86_64-static-headless
          stage=$(mktemp -d)
          mkdir -p "$stage/$name/bin" "$stage/$name/contrib/b3bridge"
          cp build-static/bin/b3coind build-static/bin/b3coin-cli \
            build-static/bin/b3coin-tx build-static/bin/b3coin-util \
            build-static/bin/b3coin-wallet \
            build-static/bin/b3-bridge-ethcheck \
            build-static/bin/b3-bridge-bootstrap-proof \
            "$stage/$name/bin/"
          cp contrib/b3bridge/README.md \
            contrib/b3bridge/b3_bridge_relayer.py \
            contrib/b3bridge/capture_eth_lc_fixture.py \
            contrib/b3bridge/capture_eth_receipts_fixture.py \
            contrib/b3bridge/eth_live_test.py \
            contrib/b3bridge/test_b3_bridge_relayer.py \
            "$stage/$name/contrib/b3bridge/"
          cp README.md COPYING "$stage/$name/"
          cat > "$stage/$name/STATIC-LINUX-README.txt" <<'EOF'
          This is the fully static x86-64 Linux operator package built against
          musl. It contains the daemon, RPC client, transaction utility, general
          utility, wallet utility, and optional bridge proof/relayer tools. The
          Python relayer requires Python 3 on the operator host. It intentionally
          does not contain Qt.
          IPC, ZeroMQ, and USDT tracepoints are also disabled in this package.
          Every executable passed static-ELF checks. The daemon and standard
          CLI utilities also passed version checks, and the daemon/RPC pair
          passed an isolated regtest startup-and-shutdown smoke test.
          EOF
          tar -C "$stage" -czf "out/$name.tar.gz" "$name"
          (cd out && sha256sum *.tar.gz > SHA256SUMS.linux-static)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-linux-x86_64-static
          path: out/

  windows-cross:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl make pkgconf python3 \
            g++-mingw-w64-x86-64-posix nsis zip
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Build depends (Qt + libs for Windows)
        run: |
          cd depends && make HOST=x86_64-w64-mingw32 -j"$(nproc)"
      - name: Configure + build
        run: |
          cmake -B build --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DBUILD_GUI=ON -DBUILD_TESTS=OFF -DBUILD_GUI_TESTS=OFF \
            -DBUILD_TX=ON -DBUILD_UTIL=ON -DBUILD_WALLET_TOOL=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target deploy
      - name: Verify x86-64 payload architecture
        run: |
          set -euo pipefail
          for binary in build/release/*.exe; do
            file "$binary" | grep -Eq 'PE32\+ executable.*x86-64'
          done
      - name: Package
        run: |
          mkdir -p out
          cp build/b3coin-win64-setup.exe \
            out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-win64-setup.exe
          zip -j out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-win64.zip \
            build/release/b3coin-qt.exe build/release/b3coind.exe \
            build/release/b3coin-cli.exe build/release/b3coin-tx.exe \
            build/release/b3coin-util.exe build/release/b3coin-wallet.exe \
            README.md COPYING
          (cd out && sha256sum *.exe *.zip > SHA256SUMS.win64)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-win64
          path: out/

  macos-arm64:
    needs: version
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: Install toolchain
        run: brew install cmake boost libevent sqlite capnp qt@6 qrencode
      - name: Configure + build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON \
            -DBUILD_TESTS=OFF -DBUILD_GUI_TESTS=OFF \
            -DBUILD_TX=ON -DBUILD_UTIL=ON -DBUILD_WALLET_TOOL=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          # deploy creates the dependency-bundled GUI app. The raw CLI targets
          # are compile checks only: Homebrew-linked binaries are not portable
          # release artifacts.
          cmake --build build -j4 --target deploy b3coind b3coin-cli b3coin-tx b3coin-util b3coin-wallet
      - name: Verify unsigned app bundle
        run: |
          set -euo pipefail
          unzip -q build/b3coin-macos-app.zip -d build/app-check
          app='build/app-check/B3 Hive.app'
          deployment_target=15.0
          expected_arch=arm64
          test "$(plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist")" = "B3 Hive"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "co.b3coin.B3Hive"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "$deployment_target"
          version_le() {
            /usr/bin/awk -v actual="$1" -v limit="$2" 'BEGIN {
              na = split(actual, a, "."); nl = split(limit, l, ".");
              for (i = 1; i <= 4; ++i) {
                av = (i <= na ? a[i] + 0 : 0); lv = (i <= nl ? l[i] + 0 : 0);
                if (av < lv) exit 0;
                if (av > lv) exit 1;
              }
              exit 0;
            }'
          }
          mach_o_count=0
          while IFS= read -r -d '' candidate; do
            if [[ "$(file -b "$candidate")" == *Mach-O* ]]; then
              test "$(lipo -archs "$candidate")" = "$expected_arch"
              if otool -L "$candidate" | /usr/bin/awk '
                  NR > 1 && $1 ~ /^\/(opt\/homebrew|usr\/local)\// {found = 1}
                  END {exit !found}
                '; then
                echo "Unbundled Homebrew dependency in $candidate" >&2
                exit 1
              fi
              minos_values=$(otool -l "$candidate" | /usr/bin/awk '
                $1 == "cmd" {build = ($2 == "LC_BUILD_VERSION"); legacy = ($2 == "LC_VERSION_MIN_MACOSX"); next}
                build && $1 == "minos" {print $2; build = 0}
                legacy && $1 == "version" {print $2; legacy = 0}
              ')
              test -n "$minos_values"
              while IFS= read -r minos; do
                version_le "$minos" "$deployment_target" || {
                  echo "$candidate requires macOS $minos, newer than $deployment_target" >&2
                  exit 1
                }
              done < <(printf '%s\n' "$minos_values")
              mach_o_count=$((mach_o_count + 1))
            fi
          done < <(find "$app" -type f -print0)
          test "$mach_o_count" -gt 0
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/b3coin-qt" -version >/dev/null
      - name: Package
        run: |
          mkdir -p out
          # The macOS release is the bundled GUI app only and requires macOS
          # 15.0 or newer, as verified from every Mach-O file above.
          cp build/b3coin-macos-app.zip out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-macos-arm64.zip
          (cd out && shasum -a 256 *.zip > SHA256SUMS.macos-arm64)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-macos-arm64
          path: out/

  macos-x86_64:
    needs: version
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: Install toolchain
        run: brew install cmake boost libevent sqlite capnp qt@6 qrencode
      - name: Configure + build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON \
            -DBUILD_TESTS=OFF -DBUILD_GUI_TESTS=OFF \
            -DBUILD_TX=ON -DBUILD_UTIL=ON -DBUILD_WALLET_TOOL=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          # deploy creates the dependency-bundled GUI app. The raw CLI targets
          # are compile checks only: Homebrew-linked binaries are not portable
          # release artifacts.
          cmake --build build -j4 --target deploy b3coind b3coin-cli b3coin-tx b3coin-util b3coin-wallet
      - name: Verify unsigned app bundle
        run: |
          set -euo pipefail
          unzip -q build/b3coin-macos-app.zip -d build/app-check
          app='build/app-check/B3 Hive.app'
          deployment_target=15.0
          expected_arch=x86_64
          test "$(plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist")" = "B3 Hive"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "co.b3coin.B3Hive"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "$deployment_target"
          version_le() {
            /usr/bin/awk -v actual="$1" -v limit="$2" 'BEGIN {
              na = split(actual, a, "."); nl = split(limit, l, ".");
              for (i = 1; i <= 4; ++i) {
                av = (i <= na ? a[i] + 0 : 0); lv = (i <= nl ? l[i] + 0 : 0);
                if (av < lv) exit 0;
                if (av > lv) exit 1;
              }
              exit 0;
            }'
          }
          mach_o_count=0
          while IFS= read -r -d '' candidate; do
            if [[ "$(file -b "$candidate")" == *Mach-O* ]]; then
              test "$(lipo -archs "$candidate")" = "$expected_arch"
              if otool -L "$candidate" | /usr/bin/awk '
                  NR > 1 && $1 ~ /^\/(opt\/homebrew|usr\/local)\// {found = 1}
                  END {exit !found}
                '; then
                echo "Unbundled Homebrew dependency in $candidate" >&2
                exit 1
              fi
              minos_values=$(otool -l "$candidate" | /usr/bin/awk '
                $1 == "cmd" {build = ($2 == "LC_BUILD_VERSION"); legacy = ($2 == "LC_VERSION_MIN_MACOSX"); next}
                build && $1 == "minos" {print $2; build = 0}
                legacy && $1 == "version" {print $2; legacy = 0}
              ')
              test -n "$minos_values"
              while IFS= read -r minos; do
                version_le "$minos" "$deployment_target" || {
                  echo "$candidate requires macOS $minos, newer than $deployment_target" >&2
                  exit 1
                }
              done < <(printf '%s\n' "$minos_values")
              mach_o_count=$((mach_o_count + 1))
            fi
          done < <(find "$app" -type f -print0)
          test "$mach_o_count" -gt 0
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/b3coin-qt" -version >/dev/null
      - name: Package
        run: |
          mkdir -p out
          # The macOS release is the bundled GUI app only and requires macOS
          # 15.0 or newer, as verified from every Mach-O file above.
          cp build/b3coin-macos-app.zip out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-macos-x86_64.zip
          (cd out && shasum -a 256 *.zip > SHA256SUMS.macos-x86_64)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-macos-x86_64
          path: out/

  publish:
    # `always()` prevents the deliberately skipped extended-test ancestor from
    # suppressing publication after release-test-policy has approved it. Every
    # direct build and safety gate must still have succeeded.
    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        needs.version.result == 'success' &&
        needs['release-test-policy'].result == 'success' &&
        needs['contract-tests'].result == 'success' &&
        needs['linux-x86_64'].result == 'success' &&
        needs['linux-x86_64-static'].result == 'success' &&
        needs['windows-cross'].result == 'success' &&
        needs['macos-arm64'].result == 'success' &&
        needs['macos-x86_64'].result == 'success'
      }}
    needs: [version, release-test-policy, contract-tests, linux-x86_64, linux-x86_64-static, windows-cross, macos-arm64, macos-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: b3-hive-*
          merge-multiple: true
      - name: Verify packaged checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.linux
          sha256sum --check SHA256SUMS.linux-static
          sha256sum --check SHA256SUMS.win64
          sha256sum --check SHA256SUMS.macos-arm64
          sha256sum --check SHA256SUMS.macos-x86_64
          cat SHA256SUMS.linux SHA256SUMS.linux-static SHA256SUMS.win64 SHA256SUMS.macos-arm64 \
            SHA256SUMS.macos-x86_64 \
            | sort -k2 > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="doc/release-notes-${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          release_flags=(--prerelease=false --latest)
          if [[ "${{ needs.version.outputs.prerelease }}" == "true" ]]; then
            release_flags=(--prerelease=true --latest=false)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft)
            asset_count=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets | length')
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to overwrite an existing published release" >&2
              exit 1
            fi
            if (( asset_count != 0 )); then
              # A cancelled upload can leave a private draft with a partial
              # asset set. Delete only that draft's assets and retry the whole
              # upload; published releases remain immutable.
              mapfile -t existing_assets < <(
                gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                  --json assets --jq '.assets[].name'
              )
              for asset in "${existing_assets[@]}"; do
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" \
                  --repo "$GITHUB_REPOSITORY" --yes
              done
            fi
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "B3 Hive $GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              --draft=false "${release_flags[@]}"
          else
            # Keep a new release private until every asset is present. A
            # cancelled upload must never expose a partial public release.
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "B3 Hive $GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              --draft
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft=false "${release_flags[@]}"
          fi
