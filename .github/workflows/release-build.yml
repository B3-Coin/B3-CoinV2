# B3 Hive unsigned release builds for Linux x86-64, Windows
# x86-64, and macOS arm64. Runs on demand ("Run workflow" button) and on
# matching version tags. Release-branch pushes do not duplicate tag builds.
name: release-build

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

# Avoid duplicate work when the same tag build is restarted or superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive and validate source version
        id: source_version
        shell: bash
        run: |
          set -euo pipefail
          cmake_version_part() {
            sed -nE "s/^set\\($1[[:space:]]+([0-9]+)\\).*$/\\1/p" CMakeLists.txt
          }
          major=$(cmake_version_part CLIENT_VERSION_MAJOR)
          minor=$(cmake_version_part CLIENT_VERSION_MINOR)
          build=$(cmake_version_part CLIENT_VERSION_BUILD)
          rc=$(cmake_version_part CLIENT_VERSION_RC)
          for part in "$major" "$minor" "$build" "$rc"; do
            [[ "$part" =~ ^[0-9]+$ ]] || {
              echo "Could not derive one numeric source-version component" >&2
              exit 1
            }
          done
          version="$major.$minor.$build"
          if (( rc > 0 )); then
            version="${version}rc${rc}"
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match source version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-x86_64:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf python3 \
            libevent-dev libboost-dev libsqlite3-dev capnproto libcapnp-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=ON
      - name: Build
        # Release packaging needs the shipped programs and the focused unit
        # gate, not every auxiliary/fuzz/test target in the repository. The
        # full matrix remains the responsibility of the ordinary CI workflow.
        run: >-
          cmake --build build -j"$(nproc)" --target
          b3coin-qt b3coind b3coin-cli b3coin-tx b3coin-util b3coin-wallet
          test_bitcoin
      - name: Release-critical unit gates
        run: |
          ./build/bin/test_bitcoin --run_test=blockchain_tests
          ./build/bin/test_bitcoin --run_test=finality_types_tests
          ./build/bin/test_bitcoin --run_test=finality_certificate_tests
          ./build/bin/test_bitcoin --run_test=modern_reward_tests
          ./build/bin/test_bitcoin --run_test=bridge_mpt_tests
          ./build/bin/test_bitcoin --run_test=bridge_eth_light_client_tests
          ./build/bin/test_bitcoin --run_test=bridge_exec_chain_tests
          ./build/bin/test_bitcoin --run_test=update_manifest_tests
          ./build/bin/test_bitcoin --run_test=update_downloader_tests
          ./build/bin/test_bitcoin --run_test=update_manager_tests
          ./build/bin/test_bitcoin --run_test=legacy_genesis_tests
          ./build/bin/test_bitcoin --run_test=legacy_wallet_send_tests
          ./build/bin/test_bitcoin --run_test=consensus_phase_tests
          ./build/bin/test_bitcoin --run_test=finality_activation_tests
          ./build/bin/test_bitcoin --run_test=finality_epoch_tests
          ./build/bin/test_bitcoin --run_test=finality_pin_tests
          ./build/bin/test_bitcoin --run_test=finality_pin_persist_tests
          ./build/bin/test_bitcoin --run_test=finality_eligibility_tests
          ./build/bin/test_bitcoin --run_test=finality_key_tests
          ./build/bin/test_bitcoin --run_test=finality_key_binding_tests
          ./build/bin/test_bitcoin --run_test=bridge_deposit_tests
          ./build/bin/test_bitcoin --run_test=modern_pos_tests
          ./build/bin/test_bitcoin --run_test=script_tests
          ./build/bin/test_bitcoin --run_test=transaction_tests
          ./build/bin/test_bitcoin --run_test=sighash_tests
          ./build/bin/test_bitcoin --run_test=finality_operations_tests
          ./build/bin/test_bitcoin --run_test=finality_production_tests
          ./build/bin/test_bitcoin --run_test=finality_qualification_tests
          ./build/bin/test_bitcoin --run_test=rpc_tests/rpc_parse_monetary_values
      - name: B3 networking and finality functional gates
        run: >-
          ./build/test/functional/test_runner.py
          p2p_private_broadcast.py
          p2p_private_broadcast_retry_v1.py
          feature_b3_finality_soak.py
          --jobs=2 --timeout-factor=3
      - name: Package
        run: |
          mkdir -p out
          name=b3-hive-v${{ needs.version.outputs.version }}-unsigned-linux-x86_64
          stage=$(mktemp -d)
          mkdir -p "$stage/$name/bin"
          cp build/bin/b3coin-qt build/bin/b3coind build/bin/b3coin-cli \
            build/bin/b3coin-tx build/bin/b3coin-util build/bin/b3coin-wallet \
            "$stage/$name/bin/"
          cp README.md COPYING "$stage/$name/"
          tar -C "$stage" -czf "out/$name.tar.gz" "$name"
          (cd out && sha256sum *.tar.gz > SHA256SUMS.linux)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-linux-x86_64
          path: out/

  windows-cross:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl make pkgconf python3 \
            g++-mingw-w64-x86-64-posix nsis zip
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Build depends (Qt + libs for Windows)
        run: |
          cd depends && make HOST=x86_64-w64-mingw32 -j"$(nproc)"
      - name: Configure + build
        run: |
          cmake -B build --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target deploy
      - name: Package
        run: |
          mkdir -p out
          cp build/b3coin-win64-setup.exe \
            out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-win64-setup.exe
          zip -j out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-win64.zip \
            build/release/b3coin-qt.exe build/release/b3coind.exe \
            build/release/b3coin-cli.exe build/release/b3coin-tx.exe \
            build/release/b3coin-util.exe build/release/b3coin-wallet.exe \
            README.md COPYING
          (cd out && sha256sum *.exe *.zip > SHA256SUMS.win64)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-win64
          path: out/

  macos-arm64:
    needs: version
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: Install toolchain
        run: brew install cmake boost libevent sqlite capnp qt@6 qrencode
      - name: Configure + build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build build -j4 --target deploy b3coind b3coin-cli b3coin-tx b3coin-util b3coin-wallet test_bitcoin
      - name: Frozen-vector spot gate
        run: |
          ./build/bin/test_bitcoin --run_test=finality_types_tests
          ./build/bin/test_bitcoin --run_test=modern_pos_tests
          ./build/bin/test_bitcoin --run_test=legacy_wallet_send_tests
          ./build/bin/test_bitcoin --run_test=walletdb_tests
      - name: Verify unsigned app bundle
        run: |
          unzip -q build/b3coin-macos-app.zip -d build/app-check
          test "$(plutil -extract CFBundleDisplayName raw 'build/app-check/B3 Hive.app/Contents/Info.plist')" = "B3 Hive"
          test "$(plutil -extract CFBundleIdentifier raw 'build/app-check/B3 Hive.app/Contents/Info.plist')" = "co.b3coin.B3Hive"
          file 'build/app-check/B3 Hive.app/Contents/MacOS/b3coin-qt' | grep -q arm64
          codesign --verify --deep --strict 'build/app-check/B3 Hive.app'
      - name: Package
        run: |
          mkdir -p out
          cp build/b3coin-macos-app.zip out/b3-hive-v${{ needs.version.outputs.version }}-unsigned-macos-arm64.zip
          name=b3-hive-v${{ needs.version.outputs.version }}-unsigned-macos-arm64-cli
          stage=$(mktemp -d)
          mkdir -p "$stage/$name/bin"
          cp build/bin/b3coind build/bin/b3coin-cli build/bin/b3coin-tx \
            build/bin/b3coin-util build/bin/b3coin-wallet "$stage/$name/bin/"
          cp README.md COPYING "$stage/$name/"
          tar -C "$stage" -czf "out/$name.tar.gz" "$name"
          (cd out && shasum -a 256 *.zip *.tar.gz > SHA256SUMS.macos-arm64)
      - uses: actions/upload-artifact@v4
        with:
          name: b3-hive-macos-arm64
          path: out/

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, linux-x86_64, windows-cross, macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: b3-hive-*
          merge-multiple: true
      - name: Verify packaged checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.linux
          sha256sum --check SHA256SUMS.win64
          sha256sum --check SHA256SUMS.macos-arm64
          cat SHA256SUMS.linux SHA256SUMS.win64 SHA256SUMS.macos-arm64 \
            | sort -k2 > SHA256SUMS
      - name: Publish final GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="doc/release-notes-${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft)
            asset_count=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets | length')
            if (( asset_count != 0 )); then
              echo "Refusing to overwrite a release that already has uploaded assets" >&2
              exit 1
            fi
            # v1.0.0 already exists as the published, assetless release-candidate
            # page. Permit that one migration; all later published tags are immutable.
            if [[ "$is_draft" != "true" && "$GITHUB_REF_NAME" != "v1.0.0" ]]; then
              echo "Refusing to overwrite an existing published release" >&2
              exit 1
            fi
            if [[ "$is_draft" != "true" ]]; then
              # Hide the assetless candidate while the complete final asset set
              # uploads. Any failure leaves a draft, never a partial public release.
              gh release edit "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" --verify-tag --draft=true
            fi
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "B3 Hive $GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              --draft=false --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "B3 Hive $GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              --latest
          fi
