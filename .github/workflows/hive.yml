name: B3 Hive app

# Checks the B3 Hive desktop app (hive/) and packages it for Linux and
# Windows with a bundled b3coind and update helper (src/update/). CI
# artifacts only: nothing is signed, tagged or published, and every node
# run is regtest with no peers.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hive/**'
      - 'src/update/**'
      - 'contrib/b3hive-release/**'
      - '.github/workflows/hive.yml'
  push:
    paths:
      - 'hive/**'
      - 'src/update/**'
      - 'contrib/b3hive-release/**'
      - '.github/workflows/hive.yml'

permissions:
  contents: read

concurrency:
  group: hive-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The packages Tauri needs to build on Linux (WebKitGTK 4.1).
  TAURI_LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev

jobs:
  core:
    name: Web pages and Rust core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hive/package-lock.json
      - name: Install Tauri's Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_LINUX_DEPS
      - name: Type-check and build the pages
        run: |
          npm ci
          npm run build
      - name: Check formatting, lints and unit tests
        working-directory: hive/src-tauri
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  node-linux:
    name: b3coind for Linux (static)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          # Any change to the depends recipes rebuilds the cached libraries.
          key: hive-depends-musl-${{ hashFiles('depends/Makefile', 'depends/funcs.mk', 'depends/packages/*.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk', 'depends/patches/**') }}
      # The same fully static musl build as the release operator binaries,
      # so the .deb needs no libraries beyond the WebKitGTK ones. The update
      # helper is built pinned to the stable channel; a second, unpinned
      # build of it and of b3hive-sign serves the helper test only.
      - name: Build b3coind and the update helper
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e OWNER="$(id -u):$(id -g)" \
            mirror.gcr.io/alpine:3.23 \
            sh -euxc '
              apk add --no-cache \
                bash binutils bison build-base cmake curl file git linux-headers \
                make ninja patch perl pkgconf python3 xz
              git config --global --add safe.directory /src
              host="$(./depends/config.guess)"
              test "$host" = x86_64-pc-linux-musl
              make -C depends HOST="$host" NO_QT=1 NO_QR=1 NO_ZMQ=1 \
                NO_USDT=1 NO_IPC=1 -j"$(nproc)"
              static="--toolchain depends/$host/toolchain.cmake
                -DCMAKE_BUILD_TYPE=Release -DAPPEND_LDFLAGS=-static-pie
                -DCMAKE_SKIP_RPATH=TRUE -DREDUCE_EXPORTS=ON
                -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_GUI_TESTS=OFF
                -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF
                -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF"
              cmake -C contrib/b3hive-release/stable-channel-v1.cmake \
                -S . -B build-static $static -DB3_HIVE_UPDATER=ON
              cmake --build build-static -j"$(nproc)" --target b3coind b3-hive-update
              for b in b3coind b3-hive-update; do
                file "build-static/bin/$b" | grep -Eq "static-pie linked|statically linked"
              done
              mkdir -p out dev
              strip --strip-debug -o out/b3-hive-node build-static/bin/b3coind
              strip --strip-debug -o out/b3-hive-update build-static/bin/b3-hive-update
              ./out/b3-hive-node -nosettings -version
              # Pinned: the helper reports a configured channel.
              echo STATUS | ./out/b3-hive-update --state-dir=/tmp/hive-update | grep -q "\"state\":\"idle\""
              cmake -S . -B build-dev $static -DB3_HIVE_UPDATER=ON -DB3_UPDATE_TOOLS=ON
              cmake --build build-dev -j"$(nproc)" --target b3-hive-update b3hive-sign
              cp build-dev/bin/b3-hive-update build-dev/bin/b3hive-sign dev/
              chown -R "$OWNER" depends build-static build-dev out dev
            '
      - uses: actions/upload-artifact@v4
        with:
          name: hive-node-linux
          path: out/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hive-update-dev-linux
          path: dev/
          retention-days: 7
          if-no-files-found: error

  node-windows:
    name: b3coind for Windows (MinGW cross-build)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl make pkgconf python3 \
            g++-mingw-w64-x86-64-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          # Any change to the depends recipes rebuilds the cached libraries.
          key: hive-depends-mingw-${{ hashFiles('depends/Makefile', 'depends/funcs.mk', 'depends/packages/*.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk', 'depends/patches/**') }}
      - name: Build b3coind.exe and the update helper
        run: |
          make -C depends HOST=x86_64-w64-mingw32 NO_QT=1 NO_QR=1 NO_ZMQ=1 \
            NO_USDT=1 -j"$(nproc)"
          cmake -C contrib/b3hive-release/stable-channel-v1.cmake \
            -S . -B build --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_GUI_TESTS=OFF \
            -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DWITH_ZMQ=OFF \
            -DB3_HIVE_UPDATER=ON
          cmake --build build -j"$(nproc)" --target b3coind b3-hive-update
          mkdir -p out
          x86_64-w64-mingw32-strip --strip-debug -o out/b3-hive-node.exe build/bin/b3coind.exe
          x86_64-w64-mingw32-strip --strip-debug -o out/b3-hive-update.exe build/bin/b3-hive-update.exe
      - uses: actions/upload-artifact@v4
        with:
          name: hive-node-windows
          path: out/
          retention-days: 7
          if-no-files-found: error

  regtest:
    name: Core against a real node (regtest, no peers)
    needs: node-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hive/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: hive-node-linux
          path: hive/node
      - name: Install Tauri's Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_LINUX_DEPS
      - uses: actions/download-artifact@v4
        with:
          name: hive-update-dev-linux
          path: hive/update-dev
      - name: Run the node tests
        run: |
          npm ci
          npm run build
          chmod +x node/b3-hive-node
          cd src-tauri
          B3_HIVE_B3COIND="$PWD/../node/b3-hive-node" \
            cargo test --locked --test node_regtest -- --test-threads=1
      # The unpinned helper takes a test channel; the network is scripted.
      - name: Run the update helper tests
        run: |
          chmod +x update-dev/*
          cd src-tauri
          B3_HIVE_UPDATE="$PWD/../update-dev/b3-hive-update" \
            B3_HIVE_SIGN="$PWD/../update-dev/b3hive-sign" \
            cargo test --locked --test update_helper

  package-linux:
    name: Package for Linux (.deb)
    needs: [core, node-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hive/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: hive-node-linux
          path: hive/node
      - name: Install Tauri's Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_LINUX_DEPS
      - name: Build the package
        run: |
          STRIP=none scripts/stage-sidecar.sh b3-hive-node node/b3-hive-node
          STRIP=none scripts/stage-sidecar.sh b3-hive-update node/b3-hive-update
          npm ci
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: hive-linux-deb
          path: hive/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 14
          if-no-files-found: error

  package-windows:
    name: Package for Windows (NSIS, unsigned)
    needs: [core, node-windows]
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hive/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: hive-node-windows
          path: hive/node
      - name: Build the installer
        run: |
          STRIP=none scripts/stage-sidecar.sh b3-hive-node node/b3-hive-node.exe x86_64-pc-windows-msvc
          STRIP=none scripts/stage-sidecar.sh b3-hive-update node/b3-hive-update.exe x86_64-pc-windows-msvc
          npm ci
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: hive-windows-setup
          path: hive/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
