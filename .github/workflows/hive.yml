name: B3 Hive app

# Checks the B3 Hive desktop app (hive/) and packages it for Linux and
# Windows with a bundled b3coind. CI artifacts only: nothing is signed,
# tagged or published, and every node run is regtest with no peers.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hive/**'
      - '.github/workflows/hive.yml'
  push:
    paths:
      - 'hive/**'
      - '.github/workflows/hive.yml'

permissions:
  contents: read

concurrency:
  group: hive-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The packages Tauri needs to build on Linux (WebKitGTK 4.1).
  TAURI_LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev

jobs:
  core:
    name: Web pages and Rust core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hive/package-lock.json
      - name: Install Tauri's Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_LINUX_DEPS
      - name: Type-check and build the pages
        run: |
          npm ci
          npm run build
      - name: Check formatting, lints and unit tests
        working-directory: hive/src-tauri
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  node-linux:
    name: b3coind for Linux (static)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          # Any change to the depends recipes rebuilds the cached libraries.
          key: hive-depends-musl-${{ hashFiles('depends/Makefile', 'depends/funcs.mk', 'depends/packages/*.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk', 'depends/patches/**') }}
      # The same fully static musl build as the release operator binaries,
      # so the .deb needs no libraries beyond the WebKitGTK ones.
      - name: Build b3coind
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e OWNER="$(id -u):$(id -g)" \
            mirror.gcr.io/alpine:3.23 \
            sh -euxc '
              apk add --no-cache \
                bash binutils bison build-base cmake curl file git linux-headers \
                make ninja patch pkgconf python3 xz
              git config --global --add safe.directory /src
              host="$(./depends/config.guess)"
              test "$host" = x86_64-pc-linux-musl
              make -C depends HOST="$host" NO_QT=1 NO_QR=1 NO_ZMQ=1 \
                NO_USDT=1 NO_IPC=1 -j"$(nproc)"
              cmake -S . -B build-static \
                --toolchain "depends/$host/toolchain.cmake" \
                -DCMAKE_BUILD_TYPE=Release \
                -DAPPEND_LDFLAGS=-static-pie \
                -DCMAKE_SKIP_RPATH=TRUE \
                -DREDUCE_EXPORTS=ON \
                -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_GUI_TESTS=OFF \
                -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF \
                -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF
              cmake --build build-static -j"$(nproc)" --target b3coind
              file build-static/bin/b3coind | grep -Eq "static-pie linked|statically linked"
              strip --strip-debug -o b3-hive-node build-static/bin/b3coind
              ./b3-hive-node -nosettings -version
              chown -R "$OWNER" depends build-static b3-hive-node
            '
      - uses: actions/upload-artifact@v4
        with:
          name: hive-node-linux
          path: b3-hive-node
          retention-days: 7
          if-no-files-found: error

  node-windows:
    name: b3coind for Windows (MinGW cross-build)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl make pkgconf python3 \
            g++-mingw-w64-x86-64-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          # Any change to the depends recipes rebuilds the cached libraries.
          key: hive-depends-mingw-${{ hashFiles('depends/Makefile', 'depends/funcs.mk', 'depends/packages/*.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk', 'depends/patches/**') }}
      - name: Build b3coind.exe
        run: |
          make -C depends HOST=x86_64-w64-mingw32 NO_QT=1 NO_QR=1 NO_ZMQ=1 \
            NO_USDT=1 -j"$(nproc)"
          cmake -S . -B build --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_GUI_TESTS=OFF \
            -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DWITH_ZMQ=OFF
          cmake --build build -j"$(nproc)" --target b3coind
          x86_64-w64-mingw32-strip --strip-debug -o b3-hive-node.exe build/bin/b3coind.exe
      - uses: actions/upload-artifact@v4
        with:
          name: hive-node-windows
          path: b3-hive-node.exe
          retention-days: 7
          if-no-files-found: error

  regtest:
    name: Core against a real node (regtest, no peers)
    needs: node-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hive/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: hive-node-linux
          path: hive/node
      - name: Install Tauri's Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_LINUX_DEPS
      - name: Run the node tests
        run: |
          npm ci
          npm run build
          chmod +x node/b3-hive-node
          cd src-tauri
          B3_HIVE_B3COIND="$PWD/../node/b3-hive-node" \
            cargo test --locked --test node_regtest -- --test-threads=1

  package-linux:
    name: Package for Linux (.deb)
    needs: [core, node-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hive/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: hive-node-linux
          path: hive/node
      - name: Install Tauri's Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_LINUX_DEPS
      - name: Build the package
        run: |
          STRIP=none scripts/stage-b3coind.sh node/b3-hive-node
          npm ci
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: hive-linux-deb
          path: hive/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 14
          if-no-files-found: error

  package-windows:
    name: Package for Windows (NSIS, unsigned)
    needs: [core, node-windows]
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hive/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: hive-node-windows
          path: hive/node
      - name: Build the installer
        run: |
          STRIP=none scripts/stage-b3coind.sh node/b3-hive-node.exe x86_64-pc-windows-msvc
          npm ci
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: hive-windows-setup
          path: hive/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
