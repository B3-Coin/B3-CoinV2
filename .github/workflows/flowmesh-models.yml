# The isolated models use only Python's standard library; no node build,
# signing keys, service, secret, or deployment step is required.
name: FlowMesh models

on:
  push:
    branches:
      - 'flowmeshV2-dev'
      - 'model/flowmesh-v2-*'
  pull_request:
    paths:
      - 'test/flowmesh_v2_model/**'
      - 'test/flowmesh_v2_agreement/**'
      - 'ci/run_flowmesh_models.py'
      - 'ci/test_flowmesh_models_runner.py'
      - '.github/workflows/flowmesh-models.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowmesh-models-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    name: Accounting and agreement (Python 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run both complete suites and discovery guards
        run: python3.14 -B ci/run_flowmesh_models.py
