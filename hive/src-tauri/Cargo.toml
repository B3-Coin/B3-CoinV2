[package]
name = "b3-hive"
version = "0.0.0"
description = "B3 Hive desktop app: Tauri shell and trusted Rust core"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "b3_hive"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP to 127.0.0.1 only: no TLS stack on purpose.
ureq = { version = "3", default-features = false, features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
